name: Discord Release Post

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    # Uncomment to skip pre-releases:
    # if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          jq -n \
            --arg tag "$TAG" --arg name "$NAME" --arg url "$URL" \
            --arg body "$(printf '%s' "$BODY" | head -c 3900)" \
            '{
              username: "CarMaint",
              embeds: [{
                title: ("🚀 CarMaint " + $tag + " released"),
                url: $url,
                description: ($body + "\n\n**Update:** `docker compose pull && docker compose up -d`"),
                color: 16739098
              }]
            }' | curl -sS -f -H "Content-Type: application/json" -d @- "$WEBHOOK"
