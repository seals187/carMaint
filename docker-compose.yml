services:
  carmaint:
    # Version via CARMAINT_VERSION in .env (latest = newest release, edge = development state)
    image: ghcr.io/seals187/carmaint:${CARMAINT_VERSION:-latest}
    container_name: carmaint
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - carmaint_data:/pb/pb_data

volumes:
  # Database, photos, receipts and PocketBase backups
  carmaint_data:
