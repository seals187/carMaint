services:
  carmaint:
    # Version über CARMAINT_VERSION in der .env (latest = neuestes Release, edge = Entwicklungsstand)
    image: ghcr.io/seals187/carmaint:${CARMAINT_VERSION:-latest}
    container_name: carmaint
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - carmaint_data:/pb/pb_data

volumes:
  # Datenbank, Fotos, Belege und PocketBase-Backups
  carmaint_data:
