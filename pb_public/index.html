<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarMaint</title>
  <meta name="description" content="Maintenance log for your vehicles">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/anton-az.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    try { const t = localStorage.getItem('carmaint:theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="logged-out">
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand logo" id="appName" aria-label="CarMaint"><span class="logo-a">CAR</span><span class="logo-b">MAINT</span></a>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" data-icon="contrast" data-i18n-title="nav.theme" data-i18n-aria="nav.theme"></button>
        <a href="#/settings" class="icon-btn auth-only" data-icon="settings" data-i18n-title="nav.settings" data-i18n-aria="nav.settings"></a>
        <button class="icon-btn auth-only" data-action="logout" data-icon="logout" data-i18n-title="nav.logout" data-i18n-aria="nav.logout"></button>
      </div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <dialog id="carDialog">
    <form id="carForm" autocomplete="off">
      <h2 id="carDialogTitle"></h2>
      <input type="hidden" name="id">
      <div class="row">
        <label class="field"><span><span data-i18n="car.make"></span> *</span><input name="make" required maxlength="100" data-i18n-placeholder="ph.make"></label>
        <label class="field"><span><span data-i18n="car.model"></span> *</span><input name="model" required maxlength="100" data-i18n-placeholder="ph.model"></label>
      </div>
      <div class="row">
        <label class="field"><span data-i18n="car.year"></span><input name="year" type="number" min="1900" max="2100" placeholder="2018"></label>
        <label class="field"><span data-i18n="car.plate"></span><input name="plate" maxlength="30" placeholder="ZH 123456"></label>
      </div>
      <label class="field"><span data-i18n="car.mileage"></span><input name="mileage" type="number" min="0" placeholder="85000"></label>
      <div class="field"><span data-i18n="car.photos"></span>
        <label class="btn ghost file-btn" data-icon="image">
          <span id="carPhotosLabel" data-i18n="car.choosePhotos"></span>
          <input type="file" id="carPhotos" multiple accept="image/jpeg" hidden>
        </label>
      </div>
      <p class="form-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close data-i18n="btn.cancel"></button>
        <button type="submit" class="btn primary" data-i18n="btn.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="entryDialog">
    <form id="entryForm" autocomplete="off">
      <h2 id="entryDialogTitle"></h2>
      <input type="hidden" name="id">
      <input type="hidden" name="car">
      <div class="row">
        <label class="field"><span data-i18n="entry.type"></span><select name="type" id="typeSelect"></select></label>
        <label class="field"><span><span data-i18n="entry.date"></span> *</span><input name="date" type="date" required></label>
      </div>
      <label class="field"><span><span data-i18n="entry.title"></span> *</span><input name="title" required maxlength="200" data-i18n-placeholder="ph.title"></label>
      <div class="row">
        <label class="field"><span data-i18n="entry.mileage"></span><input name="mileage" type="number" min="0"></label>
        <label class="field"><span><span data-i18n="entry.cost"></span> (<span id="currencySymbol">€</span>)</span><input name="cost" type="number" min="0" step="0.01" data-i18n-placeholder="ph.cost"></label>
      </div>
      <label class="field"><span data-i18n="entry.shop"></span><input name="shop" maxlength="200" data-i18n-placeholder="ph.shop"></label>
      <label class="field"><span data-i18n="entry.notes"></span><textarea name="notes" rows="3" maxlength="5000" data-i18n-placeholder="ph.notes"></textarea></label>
      <div class="field"><span data-i18n="entry.attachments"></span>
        <div class="att-editor" id="attEditor"></div>
        <label class="btn ghost file-btn" data-icon="paperclip">
          <span data-i18n="entry.attach"></span>
          <input type="file" id="attInput" multiple accept="application/pdf,image/jpeg" hidden>
        </label>
      </div>
      <p class="form-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close data-i18n="btn.cancel"></button>
        <button type="submit" class="btn primary" data-i18n="btn.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="infoDialog">
    <form id="infoForm" autocomplete="off">
      <h2 id="infoDialogTitle"></h2>
      <input type="hidden" name="carId">
      <div id="infoFields"></div>
      <p class="form-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close data-i18n="btn.cancel"></button>
        <button type="submit" class="btn primary" data-i18n="btn.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="userDialog">
    <form id="userForm" autocomplete="off">
      <h2 data-i18n="user.new"></h2>
      <label class="field"><span><span data-i18n="user.username"></span> *</span>
        <input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._\-]+" autocapitalize="none" autocomplete="off" data-i18n-placeholder="ph.username">
      </label>
      <label class="field"><span><span data-i18n="user.password"></span> *</span><input name="password" type="password" required minlength="8" autocomplete="new-password" data-i18n-placeholder="ph.password"></label>
      <label class="field"><span data-i18n="user.role"></span>
        <select name="role">
          <option value="user" data-i18n="role.user"></option>
          <option value="admin" data-i18n="role.admin"></option>
        </select>
      </label>
      <p class="muted small" data-i18n="user.allowedChars"></p>
      <p class="form-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close data-i18n="btn.cancel"></button>
        <button type="submit" class="btn primary" data-i18n="btn.create"></button>
      </div>
    </form>
  </dialog>

  <dialog id="passwordDialog">
    <form id="passwordForm" autocomplete="off">
      <h2 id="passwordDialogTitle"></h2>
      <input type="hidden" name="userId">
      <label class="field" id="oldPasswordField"><span><span data-i18n="pw.current"></span> *</span><input name="oldPassword" type="password" autocomplete="current-password"></label>
      <label class="field"><span><span data-i18n="pw.new"></span> *</span><input name="password" type="password" required minlength="8" autocomplete="new-password" data-i18n-placeholder="ph.password"></label>
      <label class="field"><span><span data-i18n="pw.repeat"></span> *</span><input name="passwordConfirm" type="password" required minlength="8" autocomplete="new-password"></label>
      <p class="form-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close data-i18n="btn.cancel"></button>
        <button type="submit" class="btn primary" data-i18n="btn.save"></button>
      </div>
    </form>
  </dialog>

  <dialog id="docsDialog" aria-labelledby="docsDialogTitle">
    <div class="dialog-body">
      <h2 id="docsDialogTitle"></h2>
      <div id="docsContent"></div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close data-i18n="lb.close"></button>
      </div>
    </div>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <img id="lbImg" alt="">
    <button class="icon-btn lb-btn lb-close" data-close data-icon="x" data-i18n-aria="lb.close"></button>
    <button class="icon-btn lb-btn lb-prev" data-lb="-1" data-icon="chevronLeft" data-i18n-aria="lb.prev"></button>
    <button class="icon-btn lb-btn lb-next" data-lb="1" data-icon="chevronRight" data-i18n-aria="lb.next"></button>
    <p id="lbCaption"></p>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
