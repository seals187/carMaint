<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarMaint</title>
  <meta name="description" content="Wartungs- und Reparaturheft für deine Fahrzeuge">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M8 19h16M10 19l2-5h8l2 5M11 22.5a1.5 1.5 0 1 0 0-.01M21 22.5a1.5 1.5 0 1 0 0-.01' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <script>
    try { const t = localStorage.getItem('carmaint:theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand"><span class="brand-icon" data-icon="car"></span>CarMaint</a>
      <div class="topbar-actions">
        <button class="icon-btn" id="exportBtn" data-icon="download" title="Backup exportieren" aria-label="Backup exportieren"></button>
        <label class="icon-btn" data-icon="upload" title="Backup importieren" aria-label="Backup importieren">
          <input type="file" id="importInput" accept="application/json,.json" hidden>
        </label>
        <button class="icon-btn" id="themeBtn" data-icon="contrast" title="Hell/Dunkel wechseln" aria-label="Hell/Dunkel wechseln"></button>
        <a href="#/settings" class="icon-btn" data-icon="settings" title="Einstellungen" aria-label="Einstellungen"></a>
      </div>
    </div>
  </header>

  <main id="app" class="container"></main>

  <dialog id="carDialog">
    <form id="carForm" autocomplete="off">
      <h2 id="carDialogTitle">Neues Fahrzeug</h2>
      <input type="hidden" name="id">
      <div class="row">
        <label class="field">Marke *<input name="make" required placeholder="z. B. VW"></label>
        <label class="field">Modell *<input name="model" required placeholder="z. B. Golf 7"></label>
      </div>
      <div class="row">
        <label class="field">Baujahr<input name="year" type="number" min="1900" max="2100" placeholder="2018"></label>
        <label class="field">Kennzeichen<input name="plate" placeholder="M-AB 1234"></label>
      </div>
      <label class="field">Kilometerstand<input name="mileage" type="number" min="0" placeholder="85000"></label>
      <div class="field">Fotos
        <label class="btn ghost file-btn" data-icon="image">
          <span id="carPhotosLabel">Fotos auswählen</span>
          <input type="file" id="carPhotos" multiple accept="image/*" hidden>
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <dialog id="entryDialog">
    <form id="entryForm" autocomplete="off">
      <h2 id="entryDialogTitle">Neuer Eintrag</h2>
      <input type="hidden" name="id">
      <input type="hidden" name="carId">
      <div class="row">
        <label class="field">Art<select name="type" id="typeSelect"></select></label>
        <label class="field">Datum *<input name="date" type="date" required></label>
      </div>
      <label class="field">Titel *<input name="title" required placeholder="z. B. Ölwechsel + Filter"></label>
      <div class="row">
        <label class="field">Kilometerstand<input name="mileage" type="number" min="0"></label>
        <label class="field"><span>Kosten (<span id="currencySymbol">€</span>)</span><input name="cost" type="number" min="0" step="0.01" placeholder="0,00"></label>
      </div>
      <label class="field">Werkstatt<input name="shop" placeholder="z. B. Autohaus Müller"></label>
      <label class="field">Notizen<textarea name="notes" rows="3" placeholder="Teile, Hinweise, nächste Fälligkeit …"></textarea></label>
      <div class="field">Belege &amp; Fotos
        <div class="att-editor" id="attEditor"></div>
        <label class="btn ghost file-btn" data-icon="paperclip">
          Datei anhängen
          <input type="file" id="attInput" multiple accept="image/*,application/pdf" hidden>
        </label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <dialog id="infoDialog">
    <form id="infoForm" autocomplete="off">
      <h2 id="infoDialogTitle">Fahrzeugdaten</h2>
      <input type="hidden" name="carId">
      <div id="infoFields"></div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" data-close>Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <dialog id="lightbox" class="lightbox">
    <img id="lbImg" alt="">
    <button class="icon-btn lb-btn lb-close" data-close data-icon="x" aria-label="Schließen"></button>
    <button class="icon-btn lb-btn lb-prev" data-lb="-1" data-icon="chevronLeft" aria-label="Vorheriges Bild"></button>
    <button class="icon-btn lb-btn lb-next" data-lb="1" data-icon="chevronRight" aria-label="Nächstes Bild"></button>
    <p id="lbCaption"></p>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
